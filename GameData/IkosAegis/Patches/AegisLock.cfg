// IkosAegis - probe core PIN lock
//
// Attaches ModuleAegisLock to every uncrewed command part in the game, stock or modded.
//
// ---------------------------------------------------------------------------------------
// Why :FOR[IkosAegis] and not :FINAL
// ---------------------------------------------------------------------------------------
// :FINAL is the last pass ModuleManager runs, so a patch there cannot be adjusted by
// anybody - not another mod, not the player's own tweak file. It is the standard way to
// make a mod uncooperative, and it is what the original concept sketch specified.
//
// :FOR[IkosAegis] runs in the per-mod pass instead, which leaves :AFTER[IkosAegis]
// available to anyone who wants the last word. It has a second effect that is the real
// reason to prefer it: :FOR declares "IkosAegis" as a valid :NEEDS token whether or not any
// assembly by that name is loaded, so other configs can write :NEEDS[IkosAegis] against us.
//
// (Note that :FOR is an implicit :NEEDS on its own name. That is harmless here - the token
// is self-declared, so the condition is always satisfied.)
// ---------------------------------------------------------------------------------------


// The version beacon, so other mods can branch on which IkosAegis is installed rather than
// only on whether one is. The dummy node exists purely to be found by #$...$ lookups.
IKOSAEGIS_VERSION
{
	name = IkosAegis
}

// A single integer, MAJOR*10000 + MINOR*100 + PATCH, because :HAS[] comparisons are
// numeric and understand only < and > - a dotted "0.1.0" could not be compared at all.
// 0.2.0 -> 200.
@IKOSAEGIS_VERSION:FOR[IkosAegis]
{
	%aegisVersion = 200
	%description = IkosAegis is installed
}


// ---------------------------------------------------------------------------------------
// The main patch
// ---------------------------------------------------------------------------------------
// Target: **every part with a ModuleCommand** - probe cores and crewed pods alike.
//
// 0.1.0 restricted this to `:HAS[#minimumCrew[0]]`, i.e. probe cores only, on the reasoning
// that a locked crewed pod is a capsule whose own crew cannot fly it. That reasoning was
// fine and the scope was still wrong: a craft whose probe core is locked but whose command
// pod is not is not a locked craft, and "lock the ship" is the thing people actually want.
//
// This is safe to do broadly now because the lock is **per vessel, not per part** - a craft
// with a probe core and two pods has one lock and one PIN, not three. See ModuleAegisLock.
//
// !MODULE[ModuleAegisLock] guards against double insertion, which matters because a player
// widening this patch in their own file would otherwise end up with two modules on one part.
@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[ModuleAegisLock]]:FOR[IkosAegis]
{
	MODULE
	{
		name = ModuleAegisLock

		// Digits in the code. 3-8; the keypad clamps anything outside that range.
		pinLength = 3

		// Wrong entries before the keypad starts refusing. 0 disables the penalty.
		lockoutAfter = 3

		// Base penalty in real seconds. Doubles per failure past the threshold, capped at
		// 300s. Real seconds, not in-game time, so it cannot be warped through.
		lockoutSeconds = 30

		// Deliberately no pinCode here. An empty code is the "never configured" state, and
		// a part in that state refuses to lock at all - shipping a default like 123 would
		// mean every probe in every save has the same code, which is worse than none.
		//
		// isLocked is likewise left to its field default. A part that arrives locked out of
		// the box with no code could never be opened.
	}
}


// ---------------------------------------------------------------------------------------
// Excluding parts you do not want locked
// ---------------------------------------------------------------------------------------
// Do not edit this file - your changes go on the next update. Put a patch of your own in
// GameData and run it after ours:
//
//   @PART[mk1pod_v2|Mark1Cockpit]:AFTER[IkosAegis] { !MODULE[ModuleAegisLock] {} }
//
// To go the other way and cover something with a command module this patch missed:
//
//   @PART[myWeirdPart]:HAS[!MODULE[ModuleAegisLock]]:AFTER[IkosAegis]
//   {
//       MODULE { name = ModuleAegisLock  pinLength = 4 }
//   }
//
// :AFTER[IkosAegis] is available because the patch above runs at :FOR[IkosAegis] rather
// than :FINAL.
//
// ---------------------------------------------------------------------------------------
// Notes for anyone editing this
// ---------------------------------------------------------------------------------------
// * A patch that matches nothing is completely silent - misspell a part name and MM issues
//   no warning at all. Check Logs/ModuleManager/MMPatch.log for the applied-patch count, or
//   just right-click a probe core and look for the Aegis readout.
// * Any error in any patch in the install suppresses the ModuleManager cache entirely, so
//   an install that re-patches on every launch is a signal worth chasing.
// * Editing this file changes its SHA, which invalidates the cache on its own. There is
//   never a need to delete ModuleManager.ConfigCache by hand.
